spring:
  cloud:
    gateway:
      mvc:
        routes:
          - id: customer-service
            uri: lb://CUSTOMER-SERVICE
            predicates:
              - Path=/api/v1/customers/**,/api/v1/customers/
          - id: product-service
            uri: lb://PRODUCT-SERVICE
            predicates:
              - Path=/api/v1/products/**,/api/v1/products
          - id: order-service
            uri: lb://ORDER-SERVICE
            predicates:
              - Path=/api/v1/orders/**,/api/v1/orders
          - id: order-line-service
            uri: lb://ORDER-SERVICE
            predicates:
              - Path=/api/v1/order-lines/**,/api/v1/order-lines
          - id: payment-service
            uri: lb://PAYMENT-SERVICE
            predicates:
              - Path=/api/v1/payments/**,/api/v1/payments
#          - id: notification-service
#            uri: lb://NOTIFICATION-SERVICE
#            predicates:
#              - Path=/api/v1/notifications/**
server:
  port: 8222
